{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="card__num">04</div>
  <div class="card__body">
    <h2>Video de demostración</h2>

    <p class="hint">Video de demostración de la Etapa 3 (máx. 4 minutos), alojado en YouTube.</p>
    <div class="video-embed">
      <iframe
        src="https://www.youtube.com/embed/{{ etapa.video_youtube_id }}"
        title="Video de demostración — Etapa 3"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
    <p class="hint">
      <a href="https://www.youtube.com/watch?v={{ etapa.video_youtube_id }}" target="_blank" rel="noopener">Ver en YouTube ↗</a>
    </p>
  </div>
</section>
{% endblock %}
